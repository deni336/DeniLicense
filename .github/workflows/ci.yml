name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.6
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install project and test tools
        run: python -m pip install --editable '.[dev]'
      - name: Static checks
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements.lock
      - name: Build Python container
        run: |
          docker compose config --quiet
          docker build --tag denilicense-ci .
      - name: Container CLI smoke test
        run: >-
          docker run --rm --entrypoint python denilicense-ci
          -m denilicense.offline_cli secret
      - name: Compose API end-to-end flow
        env:
          DENILICENSE_BOOTSTRAP_PASSWORD: correct horse battery staple
          DENILICENSE_INTEGRATION_URL: http://127.0.0.1:8080
          DENILICENSE_INTEGRATION_OWNER_EMAIL: owner@example.com
          DENILICENSE_INTEGRATION_OWNER_PASSWORD: correct horse battery staple
        run: |
          docker compose up --build --detach --wait
          docker compose run --rm \
            -e DENILICENSE_BOOTSTRAP_PASSWORD \
            api bootstrap-owner --email "$DENILICENSE_INTEGRATION_OWNER_EMAIL"
          pytest -q tests/integration
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans
