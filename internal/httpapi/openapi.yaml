        alg: {const: EdDSA}
        use: {const: sig}
        kid: {type: string}
        x: {type: string}
    JWKS:
      type: object
      required: [keys]
      properties:
        keys: {type: array, items: {$ref: '#/components/schemas/JWK'}}
