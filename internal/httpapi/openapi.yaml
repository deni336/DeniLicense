        idempotent: {type: boolean}
        warning: {type: string}
    ImportedLicenseResponse:
      type: object
      required: [license, idempotent]
      properties:
        license: {$ref: '#/components/schemas/License'}
        idempotent: {type: boolean}
    AuditRecord:
      type: object
      required: [id, occurredAt, actorKind, action, targetType, targetId, requestId, outcome, details]
      properties:
        id: {type: integer, format: int64}
        occurredAt: {type: string, format: date-time}
        actorUserId: {type: string, format: uuid}
        actorKind: {type: string, enum: [user, device, system, anonymous]}
        action: {type: string}
        targetType: {type: string}
        targetId: {type: string}
        requestId: {type: string}
        outcome: {type: string, enum: [success, denied, failure]}
        details: {type: object}
    CreateLicense:
      type: object
      additionalProperties: false
      required: [productCode, maxActivations]
      properties:
        productCode: {type: string}
        subject: {type: string}
        notBefore: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        perpetual: {type: boolean, default: false, description: Must be explicit when expiresAt is omitted}
        maxActivations: {type: integer, minimum: 1, maximum: 100000}
        offlineGraceSeconds: {type: integer, minimum: 3600, maximum: 2592000}
        entitlements:
          type: object
          additionalProperties:
            oneOf: [{type: boolean}, {type: string}, {type: integer, format: int64}]
    JWK:
      type: object
      required: [kty, crv, alg, use, kid, x]
      properties:
        kty: {const: OKP}
