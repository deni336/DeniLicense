openapi: 3.1.0
info:
  title: DeniLicense API
  version: 0.1.0
  description: First-party account, offline grant import, license claim, device activation, and lease API.
servers:
  - url: /
tags:
  - name: Auth
  - name: Licenses
  - name: Devices
  - name: Administration
paths:
  /live:
    get:
      summary: Process liveness
      responses:
        '200': {description: Alive}
  /ready:
    get:
      summary: Database and signer readiness
      responses:
        '200': {description: Ready}
        '500': {$ref: '#/components/responses/Problem'}
  /openapi.yaml:
    get:
      summary: This OpenAPI document
      responses:
        '200': {description: OpenAPI YAML}
  /.well-known/denilicense-activation-keys.json:
    get:
      summary: Ed25519 public keys for activation lease verification
      tags: [Devices]
      responses:
        '200':
          description: JWK set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JWKS'}
  /api/v1/products:
    get:
      summary: List active products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Product'}}
  /api/v1/auth/register:
    post:
      summary: Register a customer account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password: {type: string, minLength: 15, maxLength: 1024}
      responses:
        '202':
          description: Accepted whether or not the address already exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/verification/request:
    post:
      summary: Request a fresh email verification link
      tags: [Auth]
      requestBody: {$ref: '#/components/requestBodies/Email'}
      responses:
        '202':
          description: Non-enumerating acceptance response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResponse'}
  /api/v1/auth/verify-email:
    post:
      summary: Consume a single-use email verification token
      tags: [Auth]
      requestBody: {$ref: '#/components/requestBodies/Token'}
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/login:
    post:
      summary: Create an opaque server-side session
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
      responses:
        '200':
          description: Access and rotating refresh credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/refresh:
    post:
      summary: Rotate access and refresh tokens; reuse revokes the family
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: {type: string}
      responses:
        '200':
          description: Rotated credentials
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/logout:
    post:
      summary: Revoke the current session
      tags: [Auth]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/me:
    get:
      summary: Get the current account
      tags: [Auth]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {$ref: '#/components/responses/Problem'}
  /api/v1/auth/password-reset/request:
    post:
      summary: Request a password reset without account enumeration
      tags: [Auth]
      requestBody: {$ref: '#/components/requestBodies/Email'}
      responses:
        '202':
          description: Non-enumerating acceptance response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedResponse'}
  /api/v1/auth/password-reset/confirm:
    post:
      summary: Consume a reset token, change password, and revoke sessions
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: {type: string}
                newPassword: {type: string, minLength: 15, maxLength: 1024}
      responses:
        '204': {description: Password reset}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/licenses/claim:
    post:
      summary: Claim an imported or online-created license once
      tags: [Licenses]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claimCode]
              properties:
                claimCode: {type: string, example: DNL1-ABCDE-FG...}
      responses:
        '200':
          description: Claimed license
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /api/v1/licenses:
    get:
      summary: List licenses owned by the current account
      tags: [Licenses]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Owned licenses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseListResponse'}
  /api/v1/licenses/{licenseID}:
    parameters:
      - {$ref: '#/components/parameters/LicenseID'}
    get:
      summary: Read an owned license
      tags: [Licenses]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: License
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/licenses/{licenseID}/activations:
    parameters:
      - {$ref: '#/components/parameters/LicenseID'}
    get:
      summary: List installations for an owned license
      tags: [Devices]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Activations, including deactivated installations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Activation'}}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      summary: Approve an Ed25519 installation key and allocate a seat
      tags: [Devices]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [devicePublicKey]
              properties:
                devicePublicKey: {type: string, description: Canonical unpadded base64url raw Ed25519 key}
                label: {type: string, maxLength: 120}
      responses:
        '201':
          description: Activation and signed device-bound lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivationLeaseResponse'}
        '200':
          description: Idempotent activation/lease renewal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivationLeaseResponse'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/activations/{activationID}:
    parameters:
      - {$ref: '#/components/parameters/ActivationID'}
    delete:
      summary: Deactivate an owned installation and free its seat
      tags: [Devices]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deactivated, or already deactivated by this owner}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/activation-challenges:
    post:
      summary: Create a short-lived device proof-of-possession challenge
      tags: [Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [activationId]
              properties:
                activationId: {type: string, format: uuid}
      responses:
        '201':
          description: Nonce and exact base64url transcript to validate and sign
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenewalChallenge'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/activation-challenges/complete:
    post:
      summary: Prove device-key possession and receive a fresh lease
      tags: [Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, nonce, signature]
              properties:
                challengeId: {type: string, format: uuid}
                nonce: {type: string}
                signature: {type: string, description: Canonical unpadded base64url Ed25519 signature}
      responses:
        '200':
          description: Fresh signed lease
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenewalResult'}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/products:
    post:
      summary: Create a product
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: {type: string, pattern: '^[A-Z][A-Z0-9_-]{1,63}$'}
                name: {type: string, maxLength: 120}
                description: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductResponse'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/issuers:
    post:
      summary: Trust an offline issuer public-key document
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [issuer, publicKeyDocument]
              properties:
                issuer: {type: string}
                publicKeyDocument: {type: string}
                notBefore: {type: string, format: date-time}
                notAfter: {type: string, format: date-time}
      responses:
        '201':
          description: Trusted issuer key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuerResponse'}
  /api/v1/admin/issuers/{keyID}/status:
    parameters:
      - name: keyID
        in: path
        required: true
        schema: {type: string}
    post:
      summary: Activate, retire, or irreversibly revoke an issuer key
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [active, retired, revoked]}
      responses:
        '204': {description: Status changed}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/licenses:
    get:
      summary: Search and list licenses
      tags: [Administration]
      security: [{bearerAuth: []}]
      parameters:
        - {name: serial, in: query, schema: {type: string, format: uuid}}
        - {name: ownerEmail, in: query, schema: {type: string, format: email}}
        - {name: claimCodeSuffix, in: query, schema: {type: string, minLength: 4, maxLength: 4}}
        - {name: productCode, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string, enum: [active, suspended, revoked]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Matching licenses, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/License'}}
    post:
      summary: Idempotently create an online license and return its claim code
      tags: [Administration]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateLicense'}
      responses:
        '201':
          description: License and one-time claim code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLicenseResponse'}
        '200':
          description: Exact idempotent retry with the same license and claim code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IssuedLicenseResponse'}
  /api/v1/admin/licenses/import:
    post:
      summary: Verify and idempotently import a signed offline grant
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifact]
              properties:
                artifact: {type: string, description: Compact dlic1 grant}
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportedLicenseResponse'}
        '200':
          description: Exact idempotent re-import
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportedLicenseResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/licenses/{licenseID}/state:
    parameters:
      - {$ref: '#/components/parameters/LicenseID'}
    post:
      summary: Activate, suspend, or irreversibly revoke a license
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: {type: string, enum: [active, suspended, revoked]}
      responses:
        '204': {description: State changed}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/licenses/{licenseID}:
    parameters:
      - {$ref: '#/components/parameters/LicenseID'}
    get:
      summary: Get a license by ID
      tags: [Administration]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: License, including owner email when claimed
          content:
            application/json:
              schema:
                type: object
                required: [license]
                properties:
                  license: {$ref: '#/components/schemas/License'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/licenses/{licenseID}/activations:
    parameters:
      - {$ref: '#/components/parameters/LicenseID'}
    get:
      summary: List all installations for a license
      tags: [Administration, Devices]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Activations, including deactivated installations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Activation'}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/activations/{activationID}:
    parameters:
      - {$ref: '#/components/parameters/ActivationID'}
    delete:
      summary: Administratively deactivate an installation and free its seat
      tags: [Administration, Devices]
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Deactivated, or already deactivated}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users:
    get:
      summary: List users or look up one by exact normalized email
      tags: [Administration]
      security: [{bearerAuth: []}]
      parameters:
        - {name: email, in: query, schema: {type: string, format: email}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Users, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/User'}}
  /api/v1/admin/users/{userID}:
    parameters:
      - {$ref: '#/components/parameters/UserID'}
    get:
      summary: Get a user by ID
      tags: [Administration]
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users/{userID}/role:
    parameters:
      - {$ref: '#/components/parameters/UserID'}
    post:
      summary: Change a user's role and revoke all of their sessions
      description: Platform owner only. The final active platform owner cannot be demoted.
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: {type: string, enum: [platform_owner, license_admin, support, auditor, customer]}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/users/{userID}/status:
    parameters:
      - {$ref: '#/components/parameters/UserID'}
    post:
      summary: Activate or disable a user and revoke all of their sessions
      description: Platform owner only. The final active platform owner cannot be disabled.
      tags: [Administration]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {type: string, enum: [active, disabled]}
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /api/v1/admin/audit-events:
    get:
      summary: List audit events
      description: Platform owner and auditor only. Use beforeId for descending cursor pagination.
      tags: [Administration]
      security: [{bearerAuth: []}]
      parameters:
        - {name: beforeId, in: query, schema: {type: integer, format: int64, minimum: 1}}
        - {name: action, in: query, schema: {type: string}}
        - {name: targetType, in: query, schema: {type: string}}
        - {name: targetId, in: query, schema: {type: string}}
        - {name: actorUserId, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
      responses:
        '200':
          description: Audit events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AuditRecord'}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    LicenseID:
      name: licenseID
      in: path
      required: true
      schema: {type: string, format: uuid}
    ActivationID:
      name: activationID
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserID:
      name: userID
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8-128 ASCII letters, digits, dot, underscore, colon, or hyphen; bind one key to one request.
      schema: {type: string, minLength: 8, maxLength: 128}
  requestBodies:
    Email:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties:
              email: {type: string, format: email}
    Token:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token: {type: string}
  responses:
    Problem:
      description: RFC-style problem response
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        requestId: {type: string}
    TokenResponse:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt]
      properties:
        accessToken: {type: string}
        accessExpiresAt: {type: string, format: date-time}
        refreshToken: {type: string}
        refreshExpiresAt: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    AcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted: {type: boolean, const: true}
        verificationRequired: {type: boolean}
        developmentVerificationToken: {type: string, description: Development/test only}
        developmentPasswordResetToken: {type: string, description: Development/test only}
    UserResponse:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      required: [id, email, role, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {type: string, enum: [platform_owner, license_admin, support, auditor, customer]}
        status: {type: string, enum: [active, disabled]}
        emailVerifiedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string}
    ProductResponse:
      type: object
      required: [product]
      properties:
        product: {$ref: '#/components/schemas/Product'}
    License:
      type: object
      required: [id, serial, productId, productCode, source, state, issuedAt, notBefore, maxActivations, offlineGraceSeconds, entitlements, metadata, revision, claimCodeSuffix, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        serial: {type: string, format: uuid}
        productId: {type: string, format: uuid}
        productCode: {type: string}
        ownerUserId: {type: string, format: uuid}
        ownerEmail: {type: string, format: email}
        source: {type: string, enum: [online, offline_import]}
        state: {type: string, enum: [active, suspended, revoked]}
        subject: {type: string}
        issuedAt: {type: string, format: date-time}
        notBefore: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        maxActivations: {type: integer}
        offlineGraceSeconds: {type: integer}
        entitlements: {type: object}
        metadata: {type: object}
        revision: {type: integer, format: int64}
        claimCodeSuffix: {type: string}
        claimedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LicenseResponse:
      type: object
      required: [license]
      properties:
        license: {$ref: '#/components/schemas/License'}
    LicenseListResponse:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/License'}}
    Activation:
      type: object
      required: [id, licenseId, label, state, activatedAt, lastSeenAt, leaseExpiresAt]
      properties:
        id: {type: string, format: uuid}
        licenseId: {type: string, format: uuid}
        label: {type: string}
        state: {type: string, enum: [active, deactivated]}
        activatedAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        leaseExpiresAt: {type: string, format: date-time}
    ActivationLeaseResponse:
      type: object
      required: [activation, license, lease, idempotent]
      properties:
        activation: {$ref: '#/components/schemas/Activation'}
        license: {$ref: '#/components/schemas/License'}
        lease: {type: string, description: Compact dllease1 token}
        idempotent: {type: boolean}
    RenewalChallenge:
      type: object
      required: [challengeId, activationId, nonce, expiresAt, algorithm, transcript]
      properties:
        challengeId: {type: string, format: uuid}
        activationId: {type: string, format: uuid}
        nonce: {type: string}
        expiresAt: {type: string, format: date-time}
        algorithm: {type: string, const: Ed25519}
        transcript: {type: string, description: Must equal the locally reconstructed canonical transcript}
    RenewalResult:
      type: object
      required: [activation, lease]
      properties:
        activation: {$ref: '#/components/schemas/Activation'}
        lease: {type: string, description: Compact dllease1 token}
    IssuerKey:
      type: object
      required: [keyId, issuer, status, notBefore, createdAt]
      properties:
        keyId: {type: string}
        issuer: {type: string}
        status: {type: string, enum: [active, retired, revoked]}
        notBefore: {type: string, format: date-time}
        notAfter: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    IssuerResponse:
      type: object
      required: [issuerKey]
      properties:
        issuerKey: {$ref: '#/components/schemas/IssuerKey'}
    IssuedLicenseResponse:
      type: object
      required: [license, claimCode, idempotent, warning]
      properties:
        license: {$ref: '#/components/schemas/License'}
